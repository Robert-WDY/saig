<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12399d">
  <title>路线地图 · 武汉接线台</title>
  <link rel="icon" type="image/png" href="/web/icon.png">
  <link rel="stylesheet" href="/web/vendor/leaflet.css">
  <link rel="stylesheet" href="/web/style.css">
  <link rel="stylesheet" href="/web/routes.css">
  <script src="/web/vendor/leaflet.js" defer></script>
  <script src="/web/compat.js" defer></script>
  <script src="/web/route-time.js" defer></script>
  <script src="/web/wuhan-map.js" defer></script>
  <script src="/web/routes.js" defer></script>
</head>
<body>
  <a class="skip" href="#route-title">跳到路线</a>
  <!-- shared-header -->
  <main class="frame route-page">
    <header class="route-heading"><h1 id="route-title" tabindex="-1">路线地图</h1><span>武汉 · 行程编辑</span></header>
    <section class="map-layout" aria-labelledby="route-title">
      <div class="map-shell">
        <div class="map-toolbar">
          <button id="play-route" class="send" type="button" disabled>播放路线</button>
          <button id="fit-route" class="text-button" type="button" disabled>查看全程</button>
          <button id="city-view" class="text-button" type="button">武汉全貌</button>
          <button id="expand-map" class="text-button" type="button" aria-pressed="false">展开大图</button>
          <a class="text-button" href="/city">地图选点 ↗</a>
          <span id="route-progress" role="status"></span>
        </div>
        <div id="route-map" aria-label="武汉行程地图"></div>
        <div class="map-footer">
          <span id="map-source-note">武汉市内导览 · 连线表示游览顺序。</span>
        </div>
      </div>
      <section class="route-sidebar" aria-labelledby="day-title">
        <div class="route-selectors">
          <label for="route-plan">行程方案</label>
          <select id="route-plan" disabled></select>
          <div id="route-days" class="route-days" aria-label="选择日期"></div>
        </div>
        <div class="route-stops-header" id="route-stops-header">
          <h2 id="day-title">路线站点</h2>
          <p id="day-summary"></p>
        </div>
        <div id="route-editor" hidden>
          <label for="place-picker">添加游览站点</label>
          <div class="edit-picker"><select id="place-picker"></select><button type="button" id="add-stop" class="text-button">添加</button></div>
          <div id="draft-stops"></div>
          <div class="edit-actions" hidden id="edit-actions"><button class="send" type="button" id="apply-stops">应用并重排行程</button><button class="text-button" type="button" id="discard-stops">撤销改动</button></div>
          <p id="edit-feedback" role="status"></p>
        </div>
        <ol id="route-stops"></ol>
        <div id="route-empty" class="route-empty">
          <p>还没有行程。先请接待员排一条武汉路线。</p>
          <a class="text-button map-button" href="/#assistant">去规划行程</a>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
